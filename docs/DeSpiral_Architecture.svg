<circle cx="480" cy="886" r="4" fill="#7c3aed"/>
<text x="496" y="891" class="bwl">Provisioned the schema</text>
<text x="496" y="914" class="bwd">tables and the distributed vector index</text>
<circle cx="948" cy="886" r="4" fill="#7c3aed"/>
<text x="964" y="891" class="bwl">Explored it while building</text>
<text x="964" y="914" class="bwd">read-only queries, straight from Claude Code</text>
<circle cx="1416" cy="886" r="4" fill="#7c3aed"/>
<text x="1432" y="891" class="bwl">Verified the analytics</text>
<text x="1432" y="914" class="bwd">Insights panel checked against live rows</text>
<rect x="50" y="956" width="1820" height="94" rx="14" fill="#0f172a"/>
<text x="232.0" y="996" class="jic" text-anchor="middle">🔎</text>
<text x="232.0" y="1028" class="js" text-anchor="middle">You search something frightening</text>
<text x="414.0" y="1002" class="jar" text-anchor="middle">›</text>
<text x="596.0" y="996" class="jic" text-anchor="middle">🛑</text>
<text x="596.0" y="1028" class="js" text-anchor="middle">Caught before the results load</text>
<text x="778.0" y="1002" class="jar" text-anchor="middle">›</text>
<text x="960.0" y="996" class="jic" text-anchor="middle">🧘</text>
<text x="960.0" y="1028" class="js" text-anchor="middle">20 seconds of grounding</text>
<text x="1142.0" y="1002" class="jar" text-anchor="middle">›</text>
<text x="1324.0" y="996" class="jic" text-anchor="middle">💬</text>
<text x="1324.0" y="1028" class="js" text-anchor="middle">A calm, non-diagnostic reply</text>
<text x="1506.0" y="1002" class="jar" text-anchor="middle">›</text>
<text x="1688.0" y="996" class="jic" text-anchor="middle">📊</text>
<text x="1688.0" y="1028" class="js" text-anchor="middle">Remembered, and shown as patterns</text>
